version: '3.8'

services:
  # ─── Merchant Backend (Port 8001) ───────────────────────────────
  merchant-backend:
    build:
      context: ./merchant-backend
      dockerfile: Dockerfile
    container_name: merchant-backend
    ports:
      - "8001:8001"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - commerce-net

  # ─── Merchant MCP Server (Port 8002) ────────────────────────────
  merchant-mcp:
    build:
      context: ./merchant-mcp
      dockerfile: Dockerfile
    container_name: merchant-mcp
    ports:
      - "8002:8002"
    environment:
      - MERCHANT_BACKEND_URL=http://merchant-backend:8001
    depends_on:
      merchant-backend:
        condition: service_healthy
    networks:
      - commerce-net

  # ─── Agent Backend (Port 8000) ──────────────────────────────────
  agent-backend:
    build:
      context: ./agent-backend
      dockerfile: Dockerfile
    container_name: agent-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MERCHANT_MCP_URL=http://merchant-mcp:8002/sse
    depends_on:
      - merchant-mcp
    networks:
      - commerce-net

  # ─── React Frontend (Port 3000) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - agent-backend
      - merchant-backend
    networks:
      - commerce-net

networks:
  commerce-net:
    driver: bridge
