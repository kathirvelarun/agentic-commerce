# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8002

# ─── Virtual threads ─────────────────────────────────────────────────────────
spring.threads.virtual.enabled=true

# ─── Merchant backend URL ────────────────────────────────────────────────────
api.base-url=${API_BASE_URL:http://localhost:8001}

# ─── Spring AI MCP Server ────────────────────────────────────────────────────
spring.ai.mcp.server.name=reference-merchant-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.transport=HTTP_STREAMING
spring.ai.mcp.server.capabilities.tool-call=true

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
