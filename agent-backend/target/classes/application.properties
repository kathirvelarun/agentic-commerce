# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8000

# ─── Virtual threads (Project Loom) ─────────────────────────────────────────
spring.threads.virtual.enabled=true

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# ─── JPA / H2 ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/agent;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ─── VIC settings (all values from .env file / environment variables) ────────
vic.llm-provider=${LLM_PROVIDER}
vic.llm-api-key=${LLM_API_KEY}
vic.llm-model=${LLM_MODEL}
vic.llm-base-url=${LLM_BASE_URL:}

vic.vts-base-url=${VTS_BASE_URL}
vic.vts-api-key=${VTS_API_KEY}
vic.vts-shared-secret=${VTS_SHARED_SECRET}

vic.vic-base-url=${VIC_BASE_URL}
vic.vic-api-key=${VIC_API_KEY}
vic.vic-shared-secret=${VIC_SHARED_SECRET}

vic.tr-id=${TR_ID}
vic.tr-client-id=${TR_CLIENT_ID}
vic.tr-app-id=${TR_APP_ID}
vic.tr-enc-api-key=${TR_ENC_API_KEY}
vic.tr-enc-shared-secret=${TR_ENC_SHARED_SECRET}

vic.mle-enc-cert=${MLE_ENC_CERT}
vic.mle-key-id=${MLE_KEY_ID}
vic.mle-dec-key=${MLE_DEC_KEY}

vic.merchant-mcp-url=${MERCHANT_MCP_URL:http://localhost:8002/mcp}

